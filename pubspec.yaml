name: my_watchlist
description: "MyWatchlist — Tracker tontonan pribadi untuk Anime, Film, dan Series."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  http: ^1.2.2
  share_plus: ^10.1.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  isar_community_generator: ^3.3.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icon.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
